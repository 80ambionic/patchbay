# Builds on GitHub's macOS runners, so no Mac of your own is needed: push the repo, run this workflow,
# download PatchBay.dmg and the iOS simulator build from the run's Artifacts.
name: build
on: [workflow_dispatch, push]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-tests -DPATCHBAY_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --parallel
      - run: ctest --test-dir build-tests --output-on-failure
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh && scripts/build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: PatchBay-macOS-dmg, path: PatchBay.dmg }
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh && scripts/build_ios.sh simulator
